<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Maccabi Sarcelles · Outils & Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:ital,wght@0,800;1,900&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
  .service-card {
    justify-content: space-between;
  }
  .service-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
  }
  .tag {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .badge {
    font: 700 12px/1 var(--ui);
    padding: 5px 9px;
    border-radius: 6px;
    background: #1A2147;
    border: 1px solid var(--line);
    color: var(--fg);
  }
  .service-card h2 {
    margin: 2px 0 0;
    font: 800 26px/1.05 var(--display);
    text-transform: uppercase;
    letter-spacing: .02em;
  }
  .service-desc {
    margin: 0;
    color: var(--muted);
  }
  .points {
    margin: 0;
    padding-left: 18px;
    color: var(--fg);
    font-size: 14px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .points li::marker {
    color: var(--focus);
  }
  .card-actions {
    display: flex;
    padding-top: 4px;
  }
  .card-actions .btn {
    width: 100%;
  }
  .placeholder-card {
    border-style: dashed;
  }
  .code-box {
    font: 600 13px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
    background: #0A0E1F;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--muted);
  }
  search {
    min-width: min(100%, 260px);
    flex: 1 1 220px;
  }
  @media (max-width: 640px) {
    .stage-bar-group {
      width: 100%;
    }
    .stage-bar-group .seg {
      width: 100%;
    }
    search {
      width: 100%;
    }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Outils Maccabi Sarcelles</h1>
    <p class="sub">Maccabi Sarcelles · Choisis un service pour préparer et exporter tes visuels</p>
  </header>

  <section class="stage" aria-label="Filtres et recherche">
    <div class="stage-bar">
      <div class="stage-bar-group">
        <span class="lbl">Catégorie :</span>
        <span class="seg" id="categoryFilters" role="radiogroup" aria-label="Catégorie de service"></span>
      </div>
      <search>
        <input type="search" id="searchInput" placeholder="Rechercher un service…" aria-label="Rechercher un service">
      </search>
    </div>
  </section>

  <section class="grid" id="servicesGrid" aria-label="Services disponibles"></section>

  <p class="hint">Astuce : pour ajouter un nouveau service sur cette page d'accueil et dans le menu du haut, ajoute simplement une entrée dans le fichier <code>services.js</code>.</p>
</main>

<script type="module">
  import { CATEGORIES, SERVICES, mountTopNav } from './services.js';

  mountTopNav('accueil');

  let activeCat = 'tous';
  let query = '';

  const filtersEl = document.getElementById('categoryFilters');
  const gridEl = document.getElementById('servicesGrid');
  const searchEl = document.getElementById('searchInput');

  function catLabel(catId) {
    return (CATEGORIES.find(c => c.id === catId) || {}).label || catId;
  }

  function renderFilters() {
    filtersEl.innerHTML = CATEGORIES.map(c => `
      <input type="radio" name="cat" id="cat-${c.id}" value="${c.id}" ${c.id === activeCat ? 'checked' : ''}>
      <label for="cat-${c.id}">${c.label}</label>
    `).join('');
  }

  function renderServices() {
    const filtered = SERVICES.filter(s => {
      const matchCat = activeCat === 'tous' || s.categorie === activeCat;
      const q = query.trim().toLowerCase();
      const matchQ = !q || s.titre.toLowerCase().includes(q) || s.description.toLowerCase().includes(q);
      return matchCat && matchQ;
    });

    const cards = filtered.map(s => `
      <article class="panel-card service-card">
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="service-head">
            <span class="tag">${catLabel(s.categorie)}</span>
            <span class="badge">${s.badge}</span>
          </div>
          <h2>${s.titre}</h2>
          <p class="service-desc">${s.description}</p>
          <ul class="points">
            ${(s.points || []).map(p => `<li>${p}</li>`).join('')}
          </ul>
        </div>
        <div class="card-actions">
          <a href="${s.url}" class="btn primary">Ouvrir ${s.titre}</a>
        </div>
      </article>
    `);

    cards.push(`
      <article class="panel-card service-card placeholder-card">
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="service-head">
            <span class="tag">Évolutif</span>
            <span class="badge">Organisation</span>
          </div>
          <h2>Ajouter un service</h2>
          <p class="service-desc">Structure prête pour accueillir tes prochains générateurs (Joueur du match, Classement, Annonce de recrutement…).</p>
          <div class="code-box">Fichier : services.js → tableau SERVICES</div>
        </div>
      </article>
    `);

    gridEl.innerHTML = cards.join('');
  }

  filtersEl.addEventListener('change', e => {
    if (e.target.name === 'cat') {
      activeCat = e.target.value;
      renderServices();
    }
  });

  searchEl.addEventListener('input', e => {
    query = e.target.value;
    renderServices();
  });

  renderFilters();
  renderServices();
</script>
</body>
</html>
